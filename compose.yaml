# Local testing under Colima/Docker:  docker compose up --build -d
# Then:  ssh -p 4023 anyone@localhost

services:
  mud:
    build: .
    image: cyberpunkmud
    ports:
      # Loopback only: reachable from this machine, not the rest of the network.
      # Host port 4023, not 4022, so `bun server.js` can keep 4022 and both run
      # at once. Colima gives no error when the host port is already taken; the
      # container just becomes unreachable.
      - "127.0.0.1:4023:4022"
    volumes:
      - mud-data:/data
    restart: unless-stopped

volumes:
  mud-data:
